# Darkbloom provider — earnings-max baseline (example)
# Copy to ~/.config/darkbloom/provider.toml and edit name / models / concurrent.
# Verified against public alpha ~0.7.12 — re-check after upgrades.
#
# Fan control is NOT configured here. Optional (any supported Mac):
#   darkbloom fan diagnose && darkbloom fan enable
# See guide.md § Fan control.

[backend]
# Pin allowlist — do not leave empty with extra local weights on disk.
# ≥48 GB gemma-only (most mid machines):
enabled_models = ["gemma-4-26b-qat-4bit"]
# 24–32 GB (below gemma catalog floor 36 GB):
# enabled_models = ["gpt-oss-20b"]
# Large dual-warm (only if both stay healthy):
# enabled_models = ["gemma-4-26b-qat-4bit", "gpt-oss-20b"]

engine_v2_kv_backend = "auto"
# Laptop/mini 36–128 GB: 2–4 · Studio 192–512 GB: 6–8 · do not start at 24
engine_v2_max_concurrent = 4
idle_timeout_mins = 0
kv_quant = false
max_model_slots = 1
mtp = true
port = 8100
startup_preload = true
startup_preload_timeout_secs = 180
startup_selftest = true
startup_selftest_fail_closed = false

[coordinator]
heartbeat_interval_secs = 5
private_only = false
url = "wss://api.darkbloom.dev/ws/provider"

[provider]
auto_restart = true
auto_update = true
memory_reserve_gb = 4
name = "your-provider-name"
update_jitter_seconds = 300
