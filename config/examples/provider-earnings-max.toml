# Darkbloom provider — earnings baseline (example)
# Copy to ~/.config/darkbloom/provider.toml and edit the name and allowlist.
# Verified against provider 0.9.22 on 2026-10-20. Re-check after upgrades.
#
# 0.9.22 on an M3 Ultra: engine_v2_kv_backend=auto resolved paged.
# Doctor: unknown profiles keep concurrent default 4
# (8 for automatically paged models on M5 Pro, Max, and Ultra).
# Do not set the old engine_v2_max_concurrent / kv_quant / mtp booleans.
#
# Pick enabled_models from `darkbloom models catalog` for YOUR chip.
# Qwen3.5-9B is a 24 GB-floor example, not an order.
# Do not list EigenLabs/Qwen3.8-27B-4bit-mtp or glm-5.3-flash on M1-M4.
#
# Fan control is NOT configured here. Optional:
#   darkbloom fan diagnose && darkbloom fan enable
# See guide.md, Fan control.
#
# Autopilot is experimental and was not activated on the 2026-10-20 check.
# Leave it off until you have a reason.

[backend]
enabled_models = ["Qwen3.5-9B"]

engine_v2_kv_backend = "auto"
engine_v2_kv_checkpoint_quantization = "balanced"
engine_v2_kv_quantization = "native"
engine_v2_max_concurrent_by_model = {}
idle_timeout_mins = 0
max_model_slots = 1
mtp_mode = "auto"
port = 8100
preload_models = []
startup_preload = true
startup_preload_timeout_secs = 120
startup_selftest = true
startup_selftest_fail_closed = false

[coordinator]
heartbeat_interval_secs = 5
private_only = false
url = "wss://api.darkbloom.dev/ws/provider"

[gemma_optimizations]
prefill_layer18 = true
weighted_r1 = true

[provider]
auto_restart = true
auto_update = true
memory_reserve_gb = 4
name = "your-provider-name"
update_jitter_seconds = 300
